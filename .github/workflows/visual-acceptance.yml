name: Visual acceptance capture
# Feature 012 evidence trigger: bounded exact-head portrait capture for the active scene

on:
  push:
    branches: [master]
    paths:
      - "autoload/**"
      - "domain/**"
      - "persistence/**"
      - "resources/**"
      - "scenes/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "project.godot"
      - "export_presets.cfg"
      - "docs/VISUAL-DIRECTION.md"
      - ".github/workflows/visual-acceptance.yml"
  pull_request:
    paths:
      - "autoload/**"
      - "domain/**"
      - "persistence/**"
      - "resources/**"
      - "scenes/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "project.godot"
      - "export_presets.cfg"
      - "docs/VISUAL-DIRECTION.md"
      - "specs/cena-017-3d-completeness-certification/**"
      - ".github/workflows/visual-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve bounded Feature 012 visual scope
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = ((event.get("pull_request") or {}).get("body") or "")
          scene_by_roadmap = {
              "04": "operation",
              "05": "market",
              "06": "city",
          }
          match = re.search(r"SIGA-TASK-KEY:\s*012:R(04|05|06)(?:\b|:)", body)
          scope = scene_by_roadmap.get(match.group(1), "") if match else ""
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"VISUAL_SCENE_SCOPE={scope}\n")
          print(f"Visual acceptance scope: {scope or 'full-repository'}")
          PY

      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Install Godot 4.7.2 export templates
        run: |
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import and export isolated Web candidate
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
          rm -rf /tmp/da-lata-web
          mkdir -p /tmp/da-lata-web
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Web" /tmp/da-lata-web/index.html
          test -s /tmp/da-lata-web/index.html
          test -s /tmp/da-lata-web/index.js
          test -s /tmp/da-lata-web/index.wasm
          test -s /tmp/da-lata-web/index.pck

      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/visual-capture
          cd /tmp/visual-capture
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture portrait evidence
        run: |
          mkdir -p visual-acceptance
          python3 -m http.server 8080 --directory /tmp/da-lata-web >/tmp/da-lata-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null

          cat >/tmp/visual-capture/capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'visual-acceptance');
            fs.mkdirSync(outputDir, { recursive: true });

            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
            });
            const consoleErrors = [];
            const sizes = [
              { name: 'portrait-540x960', width: 540, height: 960 },
              { name: 'portrait-1080x1920', width: 1080, height: 1920 },
            ];
            const finalePhases = ['selection', 'handoff', 'coda', 'recap'];
            const destinations = [
              { name: 'operation', key: 'Digit1' },
              { name: 'market', key: 'Digit2' },
              { name: 'city', key: 'Digit3' },
              { name: 'institutional', key: 'Digit4' },
              { name: 'archive', key: 'Digit5' },
              { name: 'campaign', key: 'KeyC' },
            ];
            const requestedScope = process.env.VISUAL_SCENE_SCOPE || '';
            const scopedDestination = requestedScope
              ? destinations.find(destination => destination.name === requestedScope)
              : null;

            try {
              for (const size of sizes) {
                const context = await browser.newContext({
                  viewport: { width: size.width, height: size.height },
                  deviceScaleFactor: 1,
                });
                const page = await context.newPage();
                let narrativeReady = false;
                page.on('console', msg => {
                  if (msg.text().includes('VISUAL_ACCEPTANCE:NARRATIVE_READY')) narrativeReady = true;
                  if (msg.type() === 'error') consoleErrors.push(`[${size.name}] ${msg.text()}`);
                });
                page.on('pageerror', err => consoleErrors.push(`[${size.name}] PAGEERROR ${err.message}`));

                await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle', timeout: 120000 });
                await page.waitForFunction(() => {
                  const canvas = document.querySelector('canvas');
                  return !!canvas && canvas.width > 0 && canvas.height > 0;
                }, { timeout: 120000 });
                await page.waitForTimeout(5000);

                const canvas = page.locator('canvas').first();
                const box = await canvas.boundingBox();
                if (!box || box.width < 1 || box.height < 1) {
                  throw new Error(`Canvas has invalid bounds for ${size.name}`);
                }
                await canvas.evaluate(element => element.focus());

                if (scopedDestination) {
                  await page.keyboard.press(scopedDestination.key);
                  await page.waitForTimeout(750);
                  const scopedFrame = await page.screenshot({
                    timeout: 120000,
                    path: path.join(outputDir, `${scopedDestination.name}-${size.name}.png`),
                    fullPage: false,
                    animations: 'disabled',
                  });

                  if (scopedDestination.name === 'city') {
                    await page.keyboard.press('Digit2');
                    await page.waitForTimeout(750);
                    const awayFrame = await page.screenshot({
                      timeout: 120000,
                      fullPage: false,
                      animations: 'disabled',
                    });
                    if (scopedFrame.equals(awayFrame)) {
                      throw new Error(`City runtime responsiveness probe failed for ${size.name}: Digit2 produced no frame change`);
                    }

                    await page.keyboard.press('Digit3');
                    await page.waitForTimeout(750);
                    const returnFrame = await page.screenshot({
                      timeout: 120000,
                      fullPage: false,
                      animations: 'disabled',
                    });
                    if (awayFrame.equals(returnFrame)) {
                      throw new Error(`City runtime responsiveness probe failed for ${size.name}: Digit3 did not return from Market`);
                    }
                  }

                  await context.close();
                  continue;
                }

                for (const destination of destinations) {
                  await page.keyboard.press(destination.key);
                  await page.waitForTimeout(750);
                  await page.screenshot({
                    timeout: 120000,
                    path: path.join(outputDir, `${destination.name}-${size.name}.png`),
                    fullPage: false,
                    animations: 'disabled',
                  });
                }

                await context.close();

                narrativeReady = false;
                const narrativeContext = await browser.newContext({
                  viewport: { width: size.width, height: size.height },
                  deviceScaleFactor: 1,
                });
                const narrativePage = await narrativeContext.newPage();
                narrativePage.on('console', msg => {
                  if (msg.text().includes('VISUAL_ACCEPTANCE:NARRATIVE_READY')) narrativeReady = true;
                  if (msg.type() === 'error') consoleErrors.push(`[${size.name}:narrative] ${msg.text()}`);
                });
                narrativePage.on('pageerror', err => consoleErrors.push(`[${size.name}:narrative] PAGEERROR ${err.message}`));

                await narrativePage.goto('http://127.0.0.1:8080/?visual_acceptance=narrative', { waitUntil: 'networkidle', timeout: 120000 });
                await narrativePage.waitForFunction(() => {
                  const canvas = document.querySelector('canvas');
                  return !!canvas && canvas.width > 0 && canvas.height > 0;
                }, { timeout: 120000 });
                try {
                  await narrativePage.waitForFunction(
                    () => window.__DALATA_NARRATIVE_READY__ === true,
                    null,
                    { timeout: 10000 },
                  );
                } catch (error) {
                  const fixtureStatus = await narrativePage.evaluate(
                    () => window.__DALATA_NARRATIVE_STATUS__ || 'unset',
                  );
                  throw new Error(
                    `Narrative fixture not ready for ${size.name}; status=${fixtureStatus}; ${error.message}`
                  );
                }
                await narrativePage.screenshot({
                  timeout: 120000,
                  path: path.join(outputDir, `narrative-${size.name}.png`),
                  fullPage: false,
                  animations: 'disabled',
                });
                await narrativeContext.close();

                const finaleContext = await browser.newContext({
                  viewport: { width: size.width, height: size.height },
                  deviceScaleFactor: 1,
                });
                const finalePage = await finaleContext.newPage();
                finalePage.on('console', msg => {
                  if (msg.type() === 'error') consoleErrors.push(`[${size.name}:finale] ${msg.text()}`);
                });
                finalePage.on('pageerror', err => consoleErrors.push(`[${size.name}:finale] PAGEERROR ${err.message}`));

                for (const phase of finalePhases) {
                  await finalePage.goto(
                    `http://127.0.0.1:8080/?visual_acceptance=finale-${phase}`,
                    { waitUntil: 'networkidle', timeout: 120000 },
                  );
                  await finalePage.waitForFunction(() => {
                    const canvas = document.querySelector('canvas');
                    return !!canvas && canvas.width > 0 && canvas.height > 0;
                  }, { timeout: 120000 });
                  try {
                    await finalePage.waitForFunction(
                      expected => window.__DALATA_FINALE_READY__ === expected,
                      phase,
                      { timeout: 15000 },
                    );
                  } catch (error) {
                    const fixtureStatus = await finalePage.evaluate(
                      () => window.__DALATA_FINALE_STATUS__ || 'unset',
                    );
                    throw new Error(
                      `Finale fixture not ready for ${size.name}/${phase}; status=${fixtureStatus}; ${error.message}`
                    );
                  }
                  await finalePage.waitForTimeout(500);
                  await finalePage.screenshot({
                    timeout: 120000,
                    path: path.join(outputDir, `finale-${phase}-${size.name}.png`),
                    fullPage: false,
                    animations: 'disabled',
                  });
                }
                await finaleContext.close();
              }
            } finally {
              fs.writeFileSync(
                path.join(outputDir, 'browser-console-errors.txt'),
                consoleErrors.join('\n')
              );
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          cd /tmp/visual-capture
          node capture.cjs
          if [ -n "${VISUAL_SCENE_SCOPE:-}" ]; then
            test -s "$GITHUB_WORKSPACE/visual-acceptance/${VISUAL_SCENE_SCOPE}-portrait-540x960.png"
            test -s "$GITHUB_WORKSPACE/visual-acceptance/${VISUAL_SCENE_SCOPE}-portrait-1080x1920.png"
          else
            for destination in operation market city institutional archive campaign narrative; do
              test -s "$GITHUB_WORKSPACE/visual-acceptance/${destination}-portrait-540x960.png"
              test -s "$GITHUB_WORKSPACE/visual-acceptance/${destination}-portrait-1080x1920.png"
            done
            for phase in selection handoff coda recap; do
              test -s "$GITHUB_WORKSPACE/visual-acceptance/finale-${phase}-portrait-540x960.png"
              test -s "$GITHUB_WORKSPACE/visual-acceptance/finale-${phase}-portrait-1080x1920.png"
            done
          fi
          test ! -s "$GITHUB_WORKSPACE/visual-acceptance/browser-console-errors.txt"

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance-${{ github.sha }}
          path: visual-acceptance/
          if-no-files-found: warn
          retention-days: 14
