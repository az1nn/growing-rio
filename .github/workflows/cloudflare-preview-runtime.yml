name: Cloudflare preview runtime delivery

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_SUFFIX: growing-rio.alansa015.workers.dev
    steps:
      - name: Wait for exact-head Cloudflare build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          url = f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          deadline = time.time() + 180
          last = "not-found"
          while time.time() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              runs = [
                  run for run in payload.get("check_runs", [])
                  if (run.get("app") or {}).get("slug") == "cloudflare-workers-and-pages"
                  and run.get("name") == "Workers Builds: growing-rio"
              ]
              if runs:
                  run = max(runs, key=lambda item: item.get("started_at") or "")
                  last = f"{run.get('status')}/{run.get('conclusion')}"
                  if run.get("status") == "completed":
                      if run.get("conclusion") != "success":
                          raise SystemExit(f"Cloudflare exact-head build failed: {last}")
                      print(f"Cloudflare exact-head build ready: {last}")
                      break
              time.sleep(5)
          else:
              raise SystemExit(f"Cloudflare exact-head build did not become ready: {last}")
          PY

      - name: Probe published Godot delivery
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.environ["SHA"]
          branch = os.environ["BRANCH"].replace("/", "-")
          suffix = os.environ["PREVIEW_SUFFIX"]
          base = f"https://{branch}-{suffix}"

          def request(path, method="GET", headers=None):
              req = urllib.request.Request(
                  base + path,
                  method=method,
                  headers=headers or {},
              )
              return urllib.request.urlopen(req, timeout=30)

          with request("/version.json") as response:
              if response.status != 200:
                  raise SystemExit(f"version.json HTTP {response.status}")
              version = json.load(response)

          if version.get("source_commit") != sha:
              raise SystemExit(
                  "preview commit mismatch: "
                  f"expected={sha} actual={version.get('source_commit')}"
              )

          with request(
              "/index.wasm",
              method="HEAD",
              headers={"Accept-Encoding": "br, gzip"},
          ) as response:
              content_type = response.headers.get("content-type", "")
              content_encoding = response.headers.get("content-encoding", "")
              if response.status != 200:
                  raise SystemExit(f"index.wasm HTTP {response.status}")
              if "application/wasm" not in content_type:
                  raise SystemExit(f"index.wasm bad content-type: {content_type}")
              if content_encoding not in {"br", "gzip"}:
                  raise SystemExit(
                      "index.wasm is not served from a compressed representation: "
                      + repr(content_encoding)
                  )

          print("CLOUDFLARE PREVIEW RUNTIME DELIVERY PASSED")
          print("PREVIEW=" + base)
          print("SOURCE_COMMIT=" + sha)
          print("WASM_CONTENT_ENCODING=" + content_encoding)
          PY
