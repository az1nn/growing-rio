name: Export Godot web build

on:
  push:
    paths:
      - "autoload/**"
      - "domain/**"
      - "resources/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/export-web.yml"
  workflow_dispatch:

# Vercel builds the exact checkout via tools/build_web.sh.
# This workflow verifies that the same source can export successfully, but it
# must never mutate the source branch: bot-authored HEAD shifts prevent the
# pull_request validation workflows from running normally.
permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Install Godot 4.7.2 export templates
        run: |
          curl -L --fail --retry 3 -o /tmp/templates.tpz             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Verify exact-head Web export
        run: |
          rm -rf web
          mkdir -p web
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Web" web/index.html
          test -s web/index.html
          test -s web/index.js
          test -s web/index.wasm
          test -s web/index.pck
          echo "Web export verified without mutating the source branch."
