name: Probe WASM compression

on:
  push:
    branches:
      - infra/cloudflare-compressed-wasm
    paths:
      - ".github/workflows/wasm-compression-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure Brotli-compressed Godot WASM
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const path = 'web/index.wasm';
          const input = fs.readFileSync(path);
          const limit = 25 * 1024 * 1024;
          const compressed = zlib.brotliCompressSync(input, {
            params: {
              [zlib.constants.BROTLI_PARAM_QUALITY]: 11,
              [zlib.constants.BROTLI_PARAM_MODE]: zlib.constants.BROTLI_MODE_GENERIC,
            },
          });
          fs.writeFileSync('web/index.wasm.br', compressed);
          console.log('RAW_BYTES=' + input.length);
          console.log('BROTLI_BYTES=' + compressed.length);
          console.log('LIMIT_BYTES=' + limit);
          console.log('BROTLI_MIB=' + (compressed.length / 1024 / 1024).toFixed(2));
          console.log('STATIC_ASSET_OK=' + (compressed.length <= limit));
          if (compressed.length > limit) process.exit(2);
          NODE
