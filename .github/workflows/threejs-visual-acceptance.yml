name: Three.js visual acceptance

on:
  pull_request:
    paths:
      - "threejs/**"
      - "specs/3js-001-operation-diorama-parity/**"
      - "tools/validate_threejs.py"
      - "docs/3JS-ARCHITECTURE.md"
      - "docs/3JS-HANDOFF.md"
      - ".github/workflows/threejs-visual-acceptance.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: threejs/operation-diorama/package-lock.json

      - name: Validate Three.js structure
        run: python tools/validate_threejs.py

      - name: Install and build parity proof
        working-directory: threejs/operation-diorama
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          test -s dist/main.js
          test -s dist/vendor/three.module.js
          test -s dist/vendor/three.core.js

      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/threejs-capture
          cd /tmp/threejs-capture
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture parity evidence and enforce budget
        run: |
          mkdir -p threejs-visual-acceptance
          python3 -m http.server 8091 --directory threejs/operation-diorama/dist >/tmp/threejs-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8091/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8091/ >/dev/null

          cat >/tmp/threejs-capture/capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'threejs-visual-acceptance');
            fs.mkdirSync(outputDir, { recursive: true });
            const errors = [];
            const metricsBySize = {};
            const sizes = [
              { name: 'portrait-540x960', width: 540, height: 960 },
              { name: 'portrait-1080x1920', width: 1080, height: 1920 },
            ];

            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
            });

            try {
              for (const size of sizes) {
                const context = await browser.newContext({
                  viewport: { width: size.width, height: size.height },
                  deviceScaleFactor: 1,
                });
                const page = await context.newPage();
                page.on('console', msg => {
                  if (msg.type() === 'error') errors.push(`[${size.name}] ${msg.text()}`);
                });
                page.on('pageerror', err => errors.push(`[${size.name}] PAGEERROR ${err.message}`));

                await page.goto('http://127.0.0.1:8091/', { waitUntil: 'networkidle', timeout: 120000 });
                await page.waitForFunction(() => window.__DA_LATA_3JS_READY__ === true, null, { timeout: 120000 });
                await page.waitForTimeout(250);

                const metrics = await page.evaluate(() => window.__DA_LATA_3JS_METRICS__);
                if (!metrics) throw new Error(`Missing renderer metrics for ${size.name}`);
                metricsBySize[size.name] = metrics;

                const budgetFailures = [];
                if (metrics.drawCalls > 55) budgetFailures.push(`drawCalls=${metrics.drawCalls}`);
                if (metrics.triangles > 25000) budgetFailures.push(`triangles=${metrics.triangles}`);
                if (metrics.materialCount > 8) budgetFailures.push(`materials=${metrics.materialCount}`);
                if (metrics.textures !== 0) budgetFailures.push(`textures=${metrics.textures}`);
                if (metrics.pixelRatio > 1.5) budgetFailures.push(`pixelRatio=${metrics.pixelRatio}`);
                if (metrics.shadows !== false) budgetFailures.push(`shadows=${metrics.shadows}`);
                if (budgetFailures.length) throw new Error(`${size.name} budget failed: ${budgetFailures.join(', ')}`);

                await page.screenshot({
                  path: path.join(outputDir, `${size.name}.png`),
                  fullPage: false,
                  animations: 'disabled',
                });
                await context.close();
              }
            } finally {
              fs.writeFileSync(path.join(outputDir, 'renderer-metrics.json'), JSON.stringify(metricsBySize, null, 2));
              fs.writeFileSync(path.join(outputDir, 'browser-console-errors.txt'), errors.join('\n'));
              await browser.close();
            }

            if (errors.length) throw new Error(`Browser errors detected:\n${errors.join('\n')}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          cd /tmp/threejs-capture
          node capture.cjs
          test -s "$GITHUB_WORKSPACE/threejs-visual-acceptance/portrait-540x960.png"
          test -s "$GITHUB_WORKSPACE/threejs-visual-acceptance/portrait-1080x1920.png"
          test -s "$GITHUB_WORKSPACE/threejs-visual-acceptance/renderer-metrics.json"
          test ! -s "$GITHUB_WORKSPACE/threejs-visual-acceptance/browser-console-errors.txt"

      - name: Upload Three.js rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs-visual-acceptance-${{ github.sha }}
          path: threejs-visual-acceptance/
          if-no-files-found: warn
          retention-days: 14
