name: Validate project

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request defaults to refs/pull/<n>/merge. SIGA requires validation
          # evidence for the exact PR head, including stacked PRs.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SIGA task ownership guard (live PR claim arbitration)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls?state=open&per_page=100" > /tmp/siga-prs.json
          python3 tools/siga_claim_guard.py \
            --snapshot /tmp/siga-prs.json \
            --pr "${{ github.event.pull_request.number }}" \
            --expected-head "${{ github.event.pull_request.head.sha }}"
      - name: Feature 012 roadmap + renderer write fence
        if: github.event_name == 'pull_request'
        run: >-
          python3 tools/validate_feature012_guardrails.py
          --base-ref "origin/${{ github.base_ref }}"
          --head-ref "${{ github.head_ref }}"

      - name: Canonical project validation suite
        run: bash tools/ci_validate.sh
