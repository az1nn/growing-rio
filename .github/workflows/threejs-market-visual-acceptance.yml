name: Three.js market visual acceptance

on:
  pull_request:
    paths:
      - "threejs/market/**"
      - "specs/3js-003-market-style-continuity/**"
      - "docs/visual-references/3js-market/**"
      - "tools/validate_market_threejs.py"
      - "docs/3JS-HANDOFF.md"
      - "docs/CENA-HANDOFF.md"
      - ".github/workflows/threejs-market-visual-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: threejs/market/package-lock.json

      - name: Validate accepted Grow Room baseline
        run: python tools/validate_grow_room_threejs.py

      - name: Validate 3JS-003 structure
        run: python tools/validate_market_threejs.py

      - name: Install and build Market
        working-directory: threejs/market
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          test -s dist/main.js
          test -s dist/market.js
          test -s dist/styleTokens.js
          test -s dist/vendor/three.module.js
          test -s dist/vendor/three.core.js

      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/threejs-market-capture
          cd /tmp/threejs-market-capture
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture Market evidence and enforce budget
        run: |
          mkdir -p threejs-market-visual-acceptance
          python3 -m http.server 8093 --directory threejs/market/dist >/tmp/threejs-market-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8093/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8093/ >/dev/null

          cat >/tmp/threejs-market-capture/capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'threejs-market-visual-acceptance');
            fs.mkdirSync(outputDir, { recursive: true });
            const errors = [], metricsBySize = {};
            const sizes = [{name:'portrait-540x960',width:540,height:960},{name:'portrait-1080x1920',width:1080,height:1920}];
            const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try {
              for (const size of sizes) {
                const context=await browser.newContext({viewport:{width:size.width,height:size.height},deviceScaleFactor:1});
                const page=await context.newPage();
                page.on('console',msg=>{if(msg.type()==='error') errors.push(`[${size.name}] ${msg.text()}`);});
                page.on('pageerror',err=>errors.push(`[${size.name}] PAGEERROR ${err.message}`));
                await page.goto('http://127.0.0.1:8093/',{waitUntil:'networkidle',timeout:120000});
                await page.waitForFunction(()=>window.__DA_LATA_3JS_READY__===true&&window.__DA_LATA_3JS_SCENE__==='market',null,{timeout:120000});
                await page.waitForTimeout(250);
                const metrics=await page.evaluate(()=>window.__DA_LATA_3JS_METRICS__);
                if(!metrics) throw new Error(`Missing renderer metrics for ${size.name}`);
                metricsBySize[size.name]=metrics;
                const failures=[];
                if(metrics.drawCalls>60) failures.push(`drawCalls=${metrics.drawCalls}`);
                if(metrics.triangles>22000) failures.push(`triangles=${metrics.triangles}`);
                if(metrics.materialCount>9) failures.push(`materials=${metrics.materialCount}`);
                if(metrics.textures>0) failures.push(`textures=${metrics.textures}`);
                if(metrics.pixelRatio>1.5) failures.push(`pixelRatio=${metrics.pixelRatio}`);
                if(metrics.shadows!==false) failures.push(`shadows=${metrics.shadows}`);
                if(metrics.styleStatus!=='ACCEPT') failures.push(`styleStatus=${metrics.styleStatus}`);
                if(failures.length) throw new Error(`${size.name} budget/contract failed: ${failures.join(', ')}`);
                await page.screenshot({path:path.join(outputDir,`${size.name}.png`),fullPage:false,animations:'disabled'});
                await context.close();
              }
            } finally {
              fs.writeFileSync(path.join(outputDir,'renderer-metrics.json'),JSON.stringify(metricsBySize,null,2));
              fs.writeFileSync(path.join(outputDir,'browser-console-errors.txt'),errors.join('\n'));
              await browser.close();
            }
            if(errors.length) throw new Error(`Browser errors detected:\n${errors.join('\n')}`);
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          cd /tmp/threejs-market-capture
          node capture.cjs
          test -s "$GITHUB_WORKSPACE/threejs-market-visual-acceptance/portrait-540x960.png"
          test -s "$GITHUB_WORKSPACE/threejs-market-visual-acceptance/portrait-1080x1920.png"
          test -s "$GITHUB_WORKSPACE/threejs-market-visual-acceptance/renderer-metrics.json"
          test ! -s "$GITHUB_WORKSPACE/threejs-market-visual-acceptance/browser-console-errors.txt"

      - name: Upload Market rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs-market-visual-acceptance-${{ github.sha }}
          path: threejs-market-visual-acceptance/
          if-no-files-found: warn
          retention-days: 14
