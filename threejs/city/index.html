<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DA LATA · 3JS-004 Cidade</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071014;color:#eee4d3}
    *{box-sizing:border-box}html,body,#scene{width:100%;height:100%;margin:0;overflow:hidden;background:#071014}#scene canvas{display:block;width:100%;height:100%}
    .chrome{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(14px,2.5vw,28px)}
    .badge,.footer{width:fit-content;max-width:min(92vw,560px);border:1px solid rgba(82,199,183,.42);background:rgba(7,14,18,.48);backdrop-filter:blur(8px);box-shadow:0 16px 42px rgba(0,0,0,.2)}
    .badge{padding:10px 12px;border-radius:13px}.kicker{color:#59cdbb;font-size:11px;font-weight:800;letter-spacing:.18em}.title{margin-top:4px;font-size:clamp(17px,3.2vw,25px);font-weight:760;letter-spacing:-.02em}
    .subtitle{margin-top:3px;color:rgba(238,228,211,.66);font-size:11px}.footer{justify-self:center;align-self:end;padding:9px 12px;border-radius:999px;color:rgba(238,228,211,.76);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
  </style>
</head>
<body>
  <div id="scene" aria-label="DA LATA Three.js Cidade visual candidate"></div>
  <div class="chrome" aria-hidden="true">
    <div class="badge"><div class="kicker">DA LATA · 3JS-004</div><div class="title">Cidade · fictional hillside districts</div><div class="subtitle">CENA-021 candidate · original procedural geometry</div></div>
    <div></div><div class="footer">CENA review · CANDIDATE</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
