<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DA LATA · 3JS-001</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090d10;
        color: #e8e0d0;
      }
      * { box-sizing: border-box; }
      html, body, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d10; }
      #scene canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      .chrome { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(14px, 2.5vw, 28px); }
      .badge, .footer { width: fit-content; max-width: min(92vw, 520px); border: 1px solid rgba(28, 142, 131, .52); background: rgba(10, 15, 18, .58); backdrop-filter: blur(8px); box-shadow: 0 14px 38px rgba(0, 0, 0, .18); }
      .badge { padding: 10px 12px; border-radius: 12px; }
      .kicker { color: #4dc5b7; font-size: 11px; font-weight: 800; letter-spacing: .18em; }
      .title { margin-top: 4px; font-size: clamp(16px, 3.1vw, 24px); font-weight: 750; letter-spacing: -.02em; }
      .footer { justify-self: center; align-self: end; padding: 9px 12px; border-radius: 999px; color: rgba(232, 224, 208, .82); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="scene" aria-label="Prova de paridade visual Three.js da OperationDiorama"></div>
    <div class="chrome" aria-hidden="true">
      <div class="badge">
        <div class="kicker">DA LATA · 3JS-001</div>
        <div class="title">OperationDiorama · parity proof</div>
      </div>
      <div></div>
      <div class="footer">CENA baseline · Godot permanece canônico</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
